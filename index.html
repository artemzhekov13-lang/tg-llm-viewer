<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntx Style Viewer</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека для разжатия данных -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Подсветка кода Prism (Тёмная тема) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-color: #140f0d;
            --card-bg: #221815;
            --border-color: #382924;
            --text-color: #e6dfdc;
            --text-muted: #9c8e89;
            --accent-color: #d35400;
            --btn-bg: #2c1f1b;
            --btn-hover: #3a2b25;
            --code-header-bg: #2d201c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Верхняя панель управления */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .top-bar-left {
            display: flex;
            gap: 8px;
        }

        /* Общие стили для кнопок */
        .btn {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--text-muted);
        }

        /* Карточки сообщений */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;          /* Внутренние отступы, чтобы текст не лип к рамке */
            display: flex;
            flex-direction: column;
            gap: 12px;             /* Авто-отступ МЕЖДУ элементами внутри карточки */
            box-sizing: border-box; 
        }

        /* Мета-информация (модель, время) */
        .meta-info {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85em;
            color: var(--text-muted);
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
            font-size: 0.95em;
        }

        /* Нижний блок для кнопок копирования карточки */
        .card-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }

        /* Кастомный контейнер для блоков кода */
        .code-container {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-top: 8px;       /* Небольшой отступ сверху от текста */
            overflow: hidden;      /* Чтобы скругленные углы не резались кодом */
            background: #160f0d;   /* Цвет фона под кодом делаем чуть темнее карточки */
        }
        .code-header {
            background-color: var(--code-header-bg);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .code-lang {
            font-size: 0.8em;
            text-transform: lowercase;
            color: var(--text-muted);
            font-family: monospace;
        }
        .code-actions {
            display: flex;
            gap: 6px;
        }
        .code-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            cursor: pointer;
            transition: 0.2s;
        }
        .code-btn:hover {
            background: var(--btn-hover);
        }

        /* Стилизация самого pre с кодом */
        pre {
            margin: 0 !important;
            padding: 0 !important;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        pre.expanded {
            max-height: 600px;
            padding: 8px 12px !important; 
            margin: 0 !important;
            overflow: auto;
        }

        pre.expanded code {
            padding: 0 !important;
            margin: 0 !important;
            display: block;
            line-height: 1.4 !important;
        }
        code {
            font-family: "Fira Code", Consolas, Monaco, monospace !important;
            font-size: 0.85em !important;
        }

        /* Копирайт / Футер */
        .brand-footer {
            margin: auto 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding-top: 20px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.1em;
            letter-spacing: 1px;
            color: var(--text-color);
        }
        .brand-logo span {
            color: var(--accent-color);
        }
        .brand-link {
            font-size: 0.8em;
            color: var(--text-muted);
            text-decoration: none;
        }

        #error-box {
            color: #ff5252;
            text-align: center;
            margin-top: 50px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Верхние системные кнопки -->
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="btn" onclick="window.open(window.location.href, '_blank')">↗ В браузер</button>
            <button class="btn" onclick="copyBarLink(this)">📋 Скопировать ссылку</button>
        </div>
        <button class="btn" style="padding: 8px 10px;">🌙</button>
    </div>

    <div id="wrapper"></div>
    <div id="error-box">Произошла ошибка загрузки данных или ссылка пуста.</div>

    <!-- Футер бренда -->
    <div class="brand-footer">
        <div class="brand-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-color)"><path d="M12 2L2 22h20L12 2zm0 4.5L18.5 19h-13L12 6.5z"/></svg>
            SYNTX <span>AI</span>
        </div>
        <a href="https://t.me/syntxaibot" class="brand-link" id="bot-username">@syntxaibot</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-autoloader.min.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем сразу на максимум

        function urlSafeB64Decode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) { str += '='; }
            return atob(str);
        }

        try {
            // Берем параметры либо из URL (?data=...), либо из Telegram start_param
            let startParam = tg.initDataUnsafe.start_param;
            if (!startParam) {
                const urlParams = new URLSearchParams(window.location.search);
                startParam = urlParams.get('data');
            }
            
            if (!startParam) {
                document.getElementById('error-box').style.display = 'block';
            } else {
                const binaryString = urlSafeB64Decode(startParam);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const decompressed = pako.inflate(bytes, { to: 'string' });
                const parsed = JSON.parse(decompressed);
                
                const wrapper = document.getElementById('wrapper');
                
                if (parsed.type === 'single') {
                    renderSingleCard(parsed.data, wrapper);
                } else if (parsed.type === 'history') {
                    parsed.data.history.forEach(msg => {
                        renderHistoryCard(msg, parsed.data.model, wrapper);
                    });
                }
                
                formatCodeBlocks();
            }
        } catch (e) {
            console.error(e);
            document.getElementById('error-box').style.display = 'block';
        }

        function renderSingleCard(data, container) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="content">${escapeHtml(data.text)}</div>
                <div class="meta-info">
                    <div class="meta-item">🤖 Модель: ${data.model || 'Claude 4.1 Opus'}</div>
                    <div class="meta-item">🕒 Время: ${new Date().toLocaleString('ru-RU')} GMT+3</div>
                </div>
                <div class="card-footer">
                    <button class="btn" onclick="copyCardText(this)">📋 Скопировать</button>
                </div>
            `;
            container.appendChild(card);
        }

        function renderHistoryCard(msg, modelName, container) {
            const card = document.createElement('div');
            card.className = 'card';
            const isUser = msg.role === 'user';
            
            if (isUser) {
                card.innerHTML = `
                    <div class="content" style="font-weight: 500;">${escapeHtml(msg.content)}</div>
                    <div class="card-footer">
                        <button class="btn" onclick="copyCardText(this)">📋 Скопировать</button>
                    </div>
                `;
            } else {
                card.innerHTML = `
                    <div class="content">${escapeHtml(msg.content)}</div>
                    <div class="meta-info">
                        <div class="meta-item">🤖 Модель: ${modelName || 'Claude 4.1 Opus'}</div>
                    </div>
                    <div class="card-footer">
                        <button class="btn" onclick="copyCardText(this)">📋 Скопировать</button>
                    </div>
                `;
            }
            container.appendChild(card);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyBarLink(btn) {
            navigator.clipboard.writeText(window.location.href).then(() => {
                btn.innerText = '✅ Ссылка скопирована!';
                setTimeout(() => btn.innerText = '📋 Скопировать ссылку', 2000);
            });
        }

        function copyCardText(btn) {
            const contentEl = btn.closest('.card').querySelector('.content');
            // Копируем чистый текст без разметки кнопок свернуть/развернуть
            let textToCopy = contentEl.innerText;
            
            // Если внутри есть блоки кода, Prism может добавлять лишние элементы, но innerText забирает текст адекватно.
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.innerText = '✅ Скопировано!';
                setTimeout(() => btn.innerText = '📋 Скопировать', 2000);
            });
        }

        function copyBlockCode(btn, base64Code) {
            const code = atob(base64Code);
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = '✅ Скопировано';
                setTimeout(() => btn.innerText = 'Скопировать', 2000);
            });
        }

        function toggleCode(btn) {
            const pre = btn.closest('.code-container').querySelector('pre');
            if (pre.classList.contains('expanded')) {
                pre.classList.remove('expanded');
                btn.innerText = '↓ Развернуть';
            } else {
                pre.classList.add('expanded');
                btn.innerText = '↑ Свернуть';
            }
        }

        function formatCodeBlocks() {
            document.querySelectorAll('.content').forEach(el => {
                let html = el.innerHTML;
                const regex = /```(?:(\w+)\n)?([\s\S]*?)```/g;
                
                html = html.replace(regex, (match, lang, code) => {
                    lang = lang || 'plaintext';
                    // Декодируем HTML-сущности обратно перед кодированием в base64, чтобы в буфер падало без &lt;
                    const cleanCode = code.trim().replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                    const b64Code = btoa(unescape(encodeURIComponent(cleanCode)));

                    return `
                        <div class="code-container">
                            <div class="code-header">
                                <div class="code-lang">${lang}</div>
                                <div class="code-actions">
                                    <button class="code-btn" onclick="copyBlockCode(this, '${b64Code}')">Скопировать</button>
                                    <button class="code-btn" onclick="toggleCode(this)">↑ Свернуть</button>
                                </div>
                            </div>
                            <pre><code class="language-${lang}">${code.trim()}</code></pre>
                        </div>
                    `;
                });
                el.innerHTML = html;
            });
            Prism.highlightAll();
        }
    </script>
</body>
</html>
