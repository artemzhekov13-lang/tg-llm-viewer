<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Bot Code Viewer</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="[https://telegram.org/js/telegram-web-app.js](https://telegram.org/js/telegram-web-app.js)"></script>
    <!-- Библиотека для разжатия данных -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js](https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js)"></script>
    
    <!-- Подсветка кода Prism + Номера строк -->
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css)" rel="stylesheet" />
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css)" rel="stylesheet" />
    
    <style>
        :root {
            --bg-color: #080B11;         /* Глубокий черный с синим отливом */
            --card-bg: #111823;          /* Темно-синий для карточек (Syntax AI стиль) */
            --border-color: #1E293B;     /* Спокойная сине-серая граница элементов */
            --text-color: #F8FAFC;       /* Белый контрастный текст */
            --text-muted: #64748B;       /* Приглушенный серый */
            --accent-color: #10B981;     /* Зеленый неоновый для акцентов */
            --btn-bg: #1E293B;           /* Фоновый цвет кнопок хэдера */
            --btn-hover: #334155;
            --code-bg: #0B0F17;          /* Глубокий темный фон для самого кода */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Верхняя панель управления */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .top-bar-left {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .top-bar-left .btn {
            flex: 1;
            justify-content: center;
        }

        /* Системные кнопки */
        .btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn:hover {
            background-color: var(--btn-hover);
        }

        /* Карточка ответа */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Минимальный отступ между текстом и кодом */
        }

        /* Текстовый контент */
        .content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            font-size: 0.95em;
        }

        /* Кастомный рендеринг маркдауна */
        .content b {
            color: #FFF;
            font-weight: 600;
        }
        .content code.inline-code {
            background: #273549;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #E2E8F0;
        }

        /* КОНТЕЙНЕР КОДА В СТИЛЕ SYNTAX AI */
        .code-container {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin: 6px 0;
            overflow: hidden;
            background: var(--code-bg);
        }
        
        /* Узкая шапка кода строго как на референсе */
        .code-header {
            background-color: #17202E;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .code-lang {
            font-size: 0.85em;
            font-weight: 500;
            text-transform: lowercase;
            color: #94A3B8;
            font-family: monospace;
        }
        .code-actions {
            display: flex;
            gap: 8px;
        }
        
        /* Кнопочки внутри шапки кода */
        .code-btn {
            background: #222C3C;
            border: 1px solid #2D3A4F;
            color: #E2E8F0;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78em;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }
        .code-btn:hover {
            background: #2D3A4F;
            border-color: #475569;
        }
        .code-btn.btn-expand {
            /* Подсветим кнопку разворачивания */
        }

        /* По умолчанию тело кода полностью скрыто и не имеет внутренних отступов */
        pre {
            margin: 0 !important;
            padding: 0 !important;
            background: var(--code-bg) !important;
            display: none; 
            max-height: 500px;
            overflow: auto;
            border-top: 1px solid var(--border-color);
        }
        
        /* Когда добавлен класс expanded — отображаем и возвращаем отступы Prism */
        pre.expanded {
            display: block;
            padding: 12px 0 !important; /* Убираем лишние боковые отступы для номеров строк */
        }
        
        code {
            font-family: "Fira Code", Consolas, Monaco, monospace !important;
            font-size: 0.85em !important;
        }

        /* Кастомизация номеров строк Prism line-numbers */
        .line-numbers .line-numbers-rows {
            border-right: 1px solid #1E293B !important;
            padding-left: 10px !important;
        }

        /* Метаданные снизу */
        .meta-info {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8em;
            color: var(--text-muted);
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Общий подвал */
        .brand-footer {
            margin: auto 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-top: 16px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 1em;
            letter-spacing: 1px;
            color: var(--text-color);
        }
        .brand-logo span {
            color: var(--accent-color);
        }
        .brand-link {
            font-size: 0.75em;
            color: var(--text-muted);
            text-decoration: none;
        }

        #error-box {
            color: #ef4444;
            text-align: center;
            margin-top: 50px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <button class="btn" onclick="window.open(window.location.href, '_blank')">↗ В браузер</button>
            <button class="btn" onclick="copyBarLink(this)">🔗 Скопировать ссылку</button>
        </div>
    </div>

    <div id="wrapper"></div>
    <div id="error-box">Упс! Произошла ошибка загрузки или ссылка пуста.</div>

    <div class="brand-footer">
        <div class="brand-logo">LLM <span>BOT</span></div>
        <a href="[https://t.me/llm_helper_Goodbot](https://t.me/llm_helper_Goodbot)" class="brand-link" id="bot-username">@llm_helper_Goodbot</a>
    </div>

    <!-- Скрипты подсветки и авто-нумерации -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-autoloader.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-autoloader.min.js)"></script>
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js)"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); 

        function urlSafeB64Decode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) { str += '='; }
            return atob(str);
        }

        function parseBasicMarkdown(text) {
            let parsed = text;
            parsed = parsed.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            parsed = parsed.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            parsed = parsed.replace(/`(.*?)`/g, '<code class="inline-code">$1</code>');
            return parsed;
        }

        try {
            let startParam = tg.initDataUnsafe.start_param;
            if (!startParam) {
                const urlParams = new URLSearchParams(window.location.search);
                startParam = urlParams.get('data');
            }
            
            if (!startParam) {
                document.getElementById('error-box').style.display = 'block';
            } else {
                const binaryString = urlSafeB64Decode(startParam);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const decompressed = pako.inflate(bytes, { to: 'string' });
                const parsed = JSON.parse(decompressed);
                
                const wrapper = document.getElementById('wrapper');
                
                if (parsed.type === 'single') {
                    renderSingleCard(parsed.data, wrapper);
                } else if (parsed.type === 'history') {
                    parsed.data.history.forEach(msg => {
                        renderHistoryCard(msg, parsed.data.model, wrapper);
                    });
                }
                
                formatCodeBlocks();
            }
        } catch (e) {
            console.error(e);
            document.getElementById('error-box').style.display = 'block';
        }

        function renderSingleCard(data, container) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="content">${parseBasicMarkdown(data.text)}</div>
                <div class="meta-info">
                    <div class="meta-item">🤖 ${data.model || 'Gemini 3.1 Flash-Lite'}</div>
                    <div class="meta-item">🕒 ${new Date().toLocaleString('ru-RU')}</div>
                </div>
            `;
            container.appendChild(card);
        }

        function renderHistoryCard(msg, modelName, container) {
            const card = document.createElement('div');
            card.className = 'card';
            const isUser = msg.role === 'user';
            
            if (isUser) {
                card.innerHTML = `
                    <div class="content" style="color: #94A3B8;">${parseBasicMarkdown(msg.content)}</div>
                `;
            } else {
                card.innerHTML = `
                    <div class="content">${parseBasicMarkdown(msg.content)}</div>
                    <div class="meta-info">
                        <div class="meta-item">🤖 ${modelName || 'Gemini 3.1 Flash-Lite'}</div>
                    </div>
                `;
            }
            container.appendChild(card);
        }

        function copyBarLink(btn) {
            navigator.clipboard.writeText(window.location.href).then(() => {
                btn.innerText = '✅ Ссылка скопирована!';
                setTimeout(() => btn.innerText = '🔗 Скопировать ссылку', 2000);
            });
        }

        function copyBlockCode(btn, base64Code) {
            const code = atob(base64Code);
            navigator.clipboard.writeText(code).then(() => {
                const oldText = btn.innerHTML;
                btn.innerHTML = '📋 Скопировано';
                setTimeout(() => btn.innerHTML = oldText, 2000);
            });
        }

        function toggleCode(btn) {
            const pre = btn.closest('.code-container').querySelector('pre');
            if (pre.classList.contains('expanded')) {
                pre.classList.remove('expanded');
                btn.innerHTML = '↑ Развернуть';
            } else {
                pre.classList.add('expanded');
                btn.innerHTML = '↓ Свернуть';
            }
        }

        function formatCodeBlocks() {
            document.querySelectorAll('.content').forEach(el => {
                let html = el.innerHTML;
                
                // Улучшенный регулярный синтаксис: отлавливает ```lang с учетом любых пробелов/переносов \r?\n
                const regex = /```(?:(\w*)\s*\r?\n)?([\s\S]*?)```/g;
                
                html = html.replace(regex, (match, lang, code) => {
                    lang = lang || 'plaintext';
                    const cleanCode = code.trim().replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                    const b64Code = btoa(unescape(encodeURIComponent(cleanCode)));

                    // Возвращаем чистую структуру как на референсе 2 и 3
                    return `
                        <div class="code-container">
                            <div class="code-header">
                                <div class="code-lang">${lang}</div>
                                <div class="code-actions">
                                    <button class="code-btn" onclick="copyBlockCode(this, '${b64Code}')">📋 Скопировать</button>
                                    <button class="code-btn btn-expand" onclick="toggleCode(this)">↑ Развернуть</button>
                                </div>
                            </div>
                            <pre class="line-numbers"><code class="language-${lang}">${code.trim()}</code></pre>
                        </div>
                    `;
                });
                el.innerHTML = html;
            });
            Prism.highlightAll();
        }
    </script>
</body>
</html>
