<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Viewer</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотеки для разжатия данных (pako - аналог zlib в JS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Стили подсветки кода Prism (Тёмная тема) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #181818;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #242424;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .user-msg {
            border-left: 4px solid #5288c1;
            background-color: #1c252f;
        }
        .bot-msg {
            border-left: 4px solid #4caf50;
        }
        .author {
            font-weight: bold;
            font-size: 0.85em;
            margin-bottom: 8px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        .content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .copy-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            transition: 0.2s;
        }
        .copy-btn:hover { background-color: #444; }
        pre {
            border-radius: 8px;
            margin: 10px 0 0 0 !important;
            max-height: 400px;
            overflow: auto;
        }
        #error-box {
            color: #ff5252;
            text-align: center;
            margin-top: 50px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="wrapper"></div>
    <div id="error-box">Произошла ошибка загрузки данных или ссылка пуста.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-autoloader.min.js"></script>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Расширяем на весь экран

        // Функция для декодирования Base64 URL-safe в обычные байты
        function urlSafeB64Decode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) { str += '='; }
            return atob(str);
        }

        try {
            // УНИВЕРСАЛЬНЫЙ СБОР ДАННЫХ
            // 1. Пытаемся взять стандартный параметр из Telegram
            let startParam = tg.initDataUnsafe ? tg.initDataUnsafe.start_param : null;
            
            // 2. Если пусто, ищем параметр ?data= в обычной адресной строке
            if (!startParam) {
                const urlParams = new URLSearchParams(window.location.search);
                startParam = urlParams.get('data');
            }
            
            // 3. Если всё ещё пусто, проверяем хэш #tgWebAppStartParam=
            if (!startParam && window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                startParam = hashParams.get('tgWebAppStartParam');
            }
            
            if (!startParam) {
                document.getElementById('error-box').style.display = 'block';
            } else {
                // 1. Декодируем из Base64
                const binaryString = urlSafeB64Decode(startParam);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                // 2. Разжимаем с помощью pako (zlib декомпрессия)
                const decompressed = pako.inflate(bytes, { to: 'string' });
                const parsed = JSON.parse(decompressed);
                
                const wrapper = document.getElementById('wrapper');
                
                if (parsed.type === 'single') {
                    // Рендерим один полный ответ
                    const card = document.createElement('div');
                    card.className = 'card bot-msg';
                    card.innerHTML = `
                        <div class="author">
                            <span>Ответ модели (${parsed.data.model || 'ИИ'})</span>
                            <button class="copy-btn" onclick="copyText(this)">Скопировать</button>
                        </div>
                        <div class="content">${escapeHtml(parsed.data.text)}</div>
                    `;
                    wrapper.appendChild(card);
                    
                } else if (parsed.type === 'history') {
                    // Рендерим всю историю диалога
                    parsed.data.history.forEach(msg => {
                        const card = document.createElement('div');
                        const isUser = msg.role === 'user';
                        card.className = `card ${isUser ? 'user-msg' : 'bot-msg'}`;
                        card.innerHTML = `
                            <div class="author">
                                <span>${isUser ? 'Вы' : 'Нейросеть'}</span>
                                <button class="copy-btn" onclick="copyText(this)">Скопировать</button>
                            </div>
                            <div class="content">${escapeHtml(msg.content)}</div>
                        `;
                        wrapper.appendChild(card);
                    });
                }
                
                // Превращаем блоки кода ``` в красивые элементы Prism.js
                formatCodeBlocks();
            }
        } catch (e) {
            console.error(e);
            document.getElementById('error-box').style.display = 'block';
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyText(btn) {
            const content = btn.parentElement.nextElementSibling.innerText;
            navigator.clipboard.writeText(content).then(() => {
                btn.innerText = 'Скопировано!';
                setTimeout(() => btn.innerText = 'Скопировать', 2000);
            });
        }

        function formatCodeBlocks() {
            document.querySelectorAll('.content').forEach(el => {
                let html = el.innerHTML;
                // Регулярка ищет блоки кода вроде ```python ... ```
                const regex = /```(?:(\w+)\n)?([\s\S]*?)```/g;
                html = html.replace(regex, (match, lang, code) => {
                    lang = lang || 'plaintext';
                    return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
                });
                el.innerHTML = html;
            });
            Prism.highlightAll();
        }
    </script>
</body>
</html>
