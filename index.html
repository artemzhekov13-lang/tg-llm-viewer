<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntx Viewer</title>
    <!-- Подключаем библиотеку для красивой подсветки синтаксиса кода -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="theme-style">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --text-color: #ecf2f8;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --user-bg: #1f2937;
            --bot-bg: #161b22;
        }

        [data-theme="light"] {
            --bg-color: #f6f8fa;
            --container-bg: #ffffff;
            --text-color: #24292f;
            --border-color: #d0d7de;
            --accent-color: #0969da;
            --user-bg: #ebf5ff;
            --bot-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 40px;
        }

        .card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: border-color 0.3s, background-color 0.3s;
        }

        .user-card {
            background-color: var(--user-bg);
            align-self: flex-end;
            border-left: 4px solid var(--accent-color);
        }

        .bot-card {
            background-color: var(--bot-bg);
            align-self: flex-start;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .role-title {
            font-weight: 600;
            color: var(--accent-color);
        }

        .content {
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        pre {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            overflow-x: auto;
            position: relative;
        }

        [data-theme="light"] pre {
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, SF Pro Text, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        [data-theme="light"] .copy-btn {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            color: #24292f;
        }

        .copy-btn:hover {
            background: #30363d;
        }

        #theme-toggle {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #error-box {
            display: none;
            background-color: #ffdddd;
            color: #ff0000;
            border: 1px solid #ffcccc;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
        }

        [data-theme="dark"] #error-box {
            background-color: #3a1a1a;
            color: #ff8888;
            border-color: #5a2a2a;
        }
    </style>
</head>
<body>

    <div id="wrapper"></div>
    <div id="error-box">Не удалось загрузить или расшифровать данные.</div>

    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>

    <script>
        // Инициализируем Telegram Web App API
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем окно на максимум

        // Настройка дефолтной темы оформления на основе настроек Telegram пользователя
        if (tg.colorScheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('theme-toggle').innerText = '☀️';
            document.getElementById('theme-style').href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
        }

        // Переключатель светлой/тёмной темы по нажатию на кнопку
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('theme-toggle');
            const style = document.getElementById('theme-style');
            
            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.innerText = '🌙';
                style.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css";
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                btn.innerText = '☀️';
                style.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css";
            }
        }

        // Функция расшифровки (XOR), которая превращает байтовую строку обратно в понятный JSON текст
        function decryptData(hexStr, keyStr) {
            const encryptedBytes = hexStr.match(/.{1,2}/g).map(byte => parseInt(byte, 16));
            const keyBytes = new TextEncoder().encode(keyStr);
            const decryptedBytes = encryptedBytes.map((b, i) => b ^ keyBytes[i % keyBytes.length]);
            return new TextDecoder().decode(new Uint8Array(decryptedBytes));
        }

        // Главная функция запуска страницы
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataType = urlParams.get('type');      // Режим просмотра ("single" или "history")
            const storageId = urlParams.get('id');        // ID ячейки памяти в интернет-копилке
            const password = urlParams.get('password');   // Секретный пароль для дешифровки

            const wrapper = document.getElementById('wrapper');
            const errorBox = document.getElementById('error-box');

            if (storageId && password && dataType) {
                try {
                    // 1. Скачиваем зашифрованный пакет данных из копилки
                    const response = await fetch(`https://api.keyvalue.im/v1/get/${storageId}`);
                    if (!response.ok) throw new Error("Данные отсутствуют");
                    
                    const resData = await response.json();
                    const encryptedString = resData.value;

                    // 2. Расшифровываем скачанный текст локально на устройстве
                    const decryptedText = decryptData(encryptedString, password);
                    const allData = JSON.parse(decryptedText);
                    
                    // 3. Смотрим, какую кнопку нажал юзер, и отдаем данные на рендеринг
                    if (dataType === 'single') {
                        renderSingleCard(allData.single, wrapper);
                    } else if (dataType === 'history') {
                        allData.history.history.forEach(msg => {
                            renderHistoryCard(msg, allData.history.model, wrapper);
                        });
                    }
                    
                    // Запускаем красивую подсветку синтаксиса для блоков кода
                    formatCodeBlocks();

                } catch (e) {
                    console.error("Ошибка дешифрования или загрузки:", e);
                    errorBox.innerText = "Ошибка безопасности: Данные повреждены или ссылка устарела.";
                    errorBox.style.display = 'block';
                }
            } else {
                errorBox.style.display = 'block';
            }
        }

        // Функция создания карточки для ОДИНОЧНОГО ответа ИИ
        function renderSingleCard(data, wrapper) {
            const card = document.createElement('div');
            card.className = 'card bot-card';
            card.innerHTML = `
                <div class="header">
                    <span class="role-title">🤖 Ответ ИИ</span>
                    <span>${data.model || ''}</span>
                </div>
                <div class="content">${escapeHtml(data.text)}</div>
            `;
            wrapper.appendChild(card);
        }

        // Функция создания карточек для ИСТОРИИ всего диалога
        function renderHistoryCard(msg, model, wrapper) {
            const card = document.createElement('div');
            const isUser = msg.role === 'user';
            card.className = `card ${isUser ? 'user-card' : 'bot-card'}`;
            
            card.innerHTML = `
                <div class="header">
                    <span class="role-title">${isUser ? '👤 Вы' : '🤖 Ассистент'}</span>
                    <span>${isUser ? '' : (model || '')}</span>
                </div>
                <div class="content">${escapeHtml(msg.content)}</div>
            `;
            wrapper.appendChild(card);
        }

        // Вспомогательная функция, которая защищает разметку от случайных сбоев
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Ищет куски кода в тексте формата ```код``` и превращает их в красивые блоки
        function formatCodeBlocks() {
            const contents = document.querySelectorAll('.content');
            contents.forEach(block => {
                let text = block.innerHTML;
                const codeBlockRegex = /&lt;pre&gt;&lt;code(?: class="inline-code")?&gt;([\s\S]*?)&lt;\/code&gt;&lt;\/pre&gt;|```(\w*)\n([\s\S]*?)```/g;
                
                text = text.replace(codeBlockRegex, (match, p1, lang, code) => {
                    const finalCode = code ? code.trim() : p1.trim();
                    const finalLang = lang ? lang.toLowerCase() : 'javascript';
                    return `
                        <pre>
                            <button class="copy-btn" onclick="copyCode(this)">Копировать</button>
                            <code class="language-${finalLang}">${finalCode}</code>
                        </pre>
                    `;
                });
                block.innerHTML = text;
            });
            // Инициализация библиотеки подсветки
            hljs.highlightAll();
        }

        // Логика работы кнопки "Копировать код"
        function copyCode(button) {
            const codeBlock = button.nextElementSibling;
            navigator.clipboard.writeText(codeBlock.innerText).then(() => {
                button.innerText = 'Скопировано!';
                button.style.background = '#28a745';
                button.style.color = 'white';
                setTimeout(() => {
                    button.innerText = 'Копировать';
                    button.style.background = '';
                    button.style.color = '';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования:', err);
            });
        }

        // Запуск страницы!
        init();
    </script>
</body>
</html>
