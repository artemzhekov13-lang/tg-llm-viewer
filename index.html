<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Bot Code Viewer</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека для разжатия данных -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <!-- Подсветка кода Prism (Тёмная тема) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-color: #080B11;         /* Глубокий черный с синим отливом */
            --card-bg: #111823;          /* Темно-синий для карточек */
            --border-color: #1E293B;     /* Спокойная сине-серая граница */
            --text-color: #F8FAFC;       /* Чистый белый для контраста */
            --text-muted: #64748B;       /* Приглушенный серый для метаданных */
            --accent-color: #10B981;     /* Неоново-зеленый (кнопки, акценты) */
            --btn-bg: #1E293B;           /* Подложка кнопок */
            --btn-hover: #334155;
            --code-bg: #0B0F17;          /* Глубокий темный фон для самого кода */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Верхняя панель управления */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .top-bar-left {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .top-bar-left .btn {
            flex: 1;
            justify-content: center;
        }

        /* Кнопки */
        .btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        .btn:hover {
            background-color: var(--btn-hover);
        }

        /* Карточка ответа */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Текстовый контент */
        .content {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            font-size: 0.95em;
        }

        /* Простой парсинг Markdown элементов для красоты */
        .content b {
            color: #FFF;
            font-weight: 600;
        }
        .content code.inline-code {
            background: #273549;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #E2E8F0;
        }

        /* Контейнер кода в стиле Syntax AI */
        .code-container {
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin: 8px 0;
            overflow: hidden;
            background: var(--code-bg);
        }
        .code-header {
            background-color: #151D2A;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .code-lang {
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .code-actions {
            display: flex;
            gap: 8px;
        }
        .code-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }
        .code-btn:hover {
            background: var(--btn-bg);
            color: var(--accent-color);
        }

        /* По умолчанию скрываем тело кода, оставляя только шапку */
        pre {
            margin: 0 !important;
            padding: 0 !important;
            background: var(--code-bg) !important;
            display: none; 
            max-height: 550px;
            overflow: auto;
        }
        /* Когда развернуто — обнуляем лишние отступы, код идет с 1 строки */
        pre.expanded {
            display: block;
            padding: 12px !important;
        }
        code {
            font-family: "Fira Code", Consolas, Monaco, monospace !important;
            font-size: 0.85em !important;
        }

        /* Метаданные (компактно в строку) */
        .meta-info {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8em;
            color: var(--text-muted);
        }
        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Нижняя общая кнопка копирования всего ответа */
        .card-footer {
            display: flex;
            justify-content: flex-end;
        }
        .card-footer .btn {
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--accent-color);
        }
        .card-footer .btn:hover {
            background: rgba(16, 185, 129, 0.1);
        }

        /* Копирайт / Брендинг */
        .brand-footer {
            margin: auto 0 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-top: 16px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 1em;
            letter-spacing: 1px;
            color: var(--text-color);
        }
        .brand-logo span {
            color: var(--accent-color);
        }
        .brand-link {
            font-size: 0.75em;
            color: var(--text-muted);
            text-decoration: none;
        }

        #error-box {
            color: #ef4444;
            text-align: center;
            margin-top: 50px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Узкая и аккуратная верхняя панель -->
    <div class="top-bar">
        <div class="top-bar-left">
            <button class="btn" onclick="window.open(window.location.href, '_blank')">↗ В браузер</button>
            <button class="btn" onclick="copyBarLink(this)">🔗 Скопировать ссылку</button>
        </div>
    </div>

    <div id="wrapper"></div>
    <div id="error-box">Упс! Произошла ошибка загрузки или ссылка пуста.</div>

    <!-- Лаконичный футер без тяжелых SVG -->
    <div class="brand-footer">
        <div class="brand-logo">LLM <span>BOT</span></div>
        <a href="https://t.me/llm_helper_Goodbot" class="brand-link" id="bot-username">@llm_helper_Goodbot</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-autoloader.min.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); 

        function urlSafeB64Decode(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) { str += '='; }
            return atob(str);
        }

        // Превращаем стандартные маркеры Markdown в HTML перед выводом
        function parseBasicMarkdown(text) {
            let parsed = text;
            // Экранируем HTML
            parsed = parsed.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            // Выделение жирным **текст** -> <b>текст</b>
            parsed = parsed.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            // Инлайн-код `код` -> <code class="inline-code">код</code>
            parsed = parsed.replace(/`(.*?)`/g, '<code class="inline-code">$1</code>');
            return parsed;
        }

        try {
            let startParam = tg.initDataUnsafe.start_param;
            if (!startParam) {
                const urlParams = new URLSearchParams(window.location.search);
                startParam = urlParams.get('data');
            }
            
            if (!startParam) {
                document.getElementById('error-box').style.display = 'block';
            } else {
                const binaryString = urlSafeB64Decode(startParam);
                const len = binaryString.length;
                const bytes = new Uint8Array(len);
                for (let i = 0; i < len; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const decompressed = pako.inflate(bytes, { to: 'string' });
                const parsed = JSON.parse(decompressed);
                
                const wrapper = document.getElementById('wrapper');
                
                if (parsed.type === 'single') {
                    renderSingleCard(parsed.data, wrapper);
                } else if (parsed.type === 'history') {
                    parsed.data.history.forEach(msg => {
                        renderHistoryCard(msg, parsed.data.model, wrapper);
                    });
                }
                
                formatCodeBlocks();
            }
        } catch (e) {
            console.error(e);
            document.getElementById('error-box').style.display = 'block';
        }

        function renderSingleCard(data, container) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="content">${parseBasicMarkdown(data.text)}</div>
                <div class="meta-info">
                    <div class="meta-item">🤖 ${data.model || 'Gemini 3.1 Flash-Lite'}</div>
                    <div class="meta-item">🕒 ${new Date().toLocaleString('ru-RU')}</div>
                </div>
                <div class="card-footer">
                    <button class="btn" onclick="copyCardText(this)">📋 Скопировать весь ответ</button>
                </div>
            `;
            container.appendChild(card);
        }

        function renderHistoryCard(msg, modelName, container) {
            const card = document.createElement('div');
            card.className = 'card';
            const isUser = msg.role === 'user';
            
            if (isUser) {
                card.innerHTML = `
                    <div class="content" style="color: #94A3B8;">${parseBasicMarkdown(msg.content)}</div>
                `;
            } else {
                card.innerHTML = `
                    <div class="content">${parseBasicMarkdown(msg.content)}</div>
                    <div class="meta-info">
                        <div class="meta-item">🤖 ${modelName || 'Gemini 3.1 Flash-Lite'}</div>
                    </div>
                    <div class="card-footer">
                        <button class="btn" onclick="copyCardText(this)">📋 Скопировать весь ответ</button>
                    </div>
                `;
            }
            container.appendChild(card);
        }

        function copyBarLink(btn) {
            navigator.clipboard.writeText(window.location.href).then(() => {
                btn.innerText = '✅ Скопировано!';
                setTimeout(() => btn.innerText = '🔗 Скопировать ссылку', 2000);
            });
        }

        function copyCardText(btn) {
            const contentEl = btn.closest('.card').querySelector('.content');
            let textToCopy = contentEl.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                btn.innerText = '✅ Успешно скопировано!';
                setTimeout(() => btn.innerText = '📋 Скопировать весь ответ', 2000);
            });
        }

        function copyBlockCode(btn, base64Code) {
            const code = atob(base64Code);
            navigator.clipboard.writeText(code).then(() => {
                btn.innerText = '✅ Скопирован';
                setTimeout(() => btn.innerText = '⬇️ Копировать', 2000);
            });
        }

        function toggleCode(btn) {
            const pre = btn.closest('.code-container').querySelector('pre');
            if (pre.classList.contains('expanded')) {
                pre.classList.remove('expanded');
                btn.innerText = '👇 Развернуть';
            } else {
                pre.classList.add('expanded');
                btn.innerText = '👆 Свернуть';
            }
        }

        function formatCodeBlocks() {
            document.querySelectorAll('.content').forEach(el => {
                let html = el.innerHTML;
                const regex = /```(?:(\w+)\n)?([\s\S]*?)```/g;
                
                html = html.replace(regex, (match, lang, code) => {
                    lang = lang || 'plaintext';
                    // Убираем возможные артефакты экранирования перед генерацией base64
                    const cleanCode = code.trim().replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
                    const b64Code = btoa(unescape(encodeURIComponent(cleanCode)));

                    return `
                        <div class="code-container">
                            <div class="code-header">
                                <div class="code-lang">${lang}</div>
                                <div class="code-actions">
                                    <button class="code-btn" onclick="copyBlockCode(this, '${b64Code}')">⬇️ Копировать</button>
                                    <button class="code-btn" onclick="toggleCode(this)">👇 Развернуть</button>
                                </div>
                            </div>
                            <pre><code class="language-${lang}">${code.trim()}</code></pre>
                        </div>
                    `;
                });
                el.innerHTML = html;
            });
            Prism.highlightAll();
        }
    </script>
</body>
</html>
